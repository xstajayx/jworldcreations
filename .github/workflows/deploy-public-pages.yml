name: Deploy JWorldCreations Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jworldcreations-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Build approved public website
        env:
          JWORLD_OPERATOR_NAME: ${{ secrets.JWORLD_OPERATOR_NAME }}
          JWORLD_BUSINESS_ADDRESS: ${{ secrets.JWORLD_BUSINESS_ADDRESS }}
          JWORLD_PUBLISH_DISCLOSURE: '1'
        run: |
          node tools/build-public.mjs "$RUNNER_TEMP/jworld-public"
          test -f "$RUNNER_TEMP/jworld-public/CNAME"
          test -f "$RUNNER_TEMP/jworld-public/index.html"
          test -f "$RUNNER_TEMP/jworld-public/business-information.html"
          if grep -q '<!-- operator-disclosure -->' "$RUNNER_TEMP/jworld-public/business-information.html"; then
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/jworld-public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
